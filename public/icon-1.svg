<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark rich red gradient matching bg-red-900 to bg-red-950 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#881616"/>
      <stop offset="50%" stop-color="#701212"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <!-- Subtle top highlight for native app icon depth -->
    <radialGradient id="topGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#991b1b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <rect width="512" height="512" fill="url(#topGlow)"/>

  <!-- Subtle inner border seal effect matching header badge -->
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="#ef4444" stroke-opacity="0.3" stroke-width="3"/>
  <rect x="24" y="24" width="464" height="464" rx="86" fill="none" stroke="#fffbeb" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Character 龙 in classical serif typography and warm amber-50 ivory tone -->
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle"
        font-family="Songti SC, STSong, 'Noto Serif SC', 'Source Han Serif SC', SimSun, Georgia, serif"
        font-size="285" font-weight="700" fill="#fffbeb"
        style="text-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);">龙</text>
</svg>
